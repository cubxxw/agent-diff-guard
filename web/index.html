<!doctype html>
<!--
  agent-diff-guard · Guard Console
  单文件壳 + app.js,零依赖、零构建、本机离线。
  设计系统:DayPage 暖白 + 琥珀棕(从 Claude Design 重构稿落地,再做加法)。
  8 页:总览 / 审查队列 / 守门记录 / 规则 / 越界记录 / 危险地图 / 用量成本 / 终端信箱。
  全部数据来自本机只读 API(serve-local.ts),刷新即最新,不联网、不上传。
-->
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agent-diff-guard · 控制台</title>
<style>
/* ============================================================
   设计 Tokens — DayPage Warm-White v3
   ============================================================ */
:root {
  /* 背景 */
  --bg-warm: #FAF8F6; --surface-white: #FFFFFF; --surface-sunken: #F3F0EB;
  /* 文字 */
  --fg-primary: #2B2822; --fg-muted: #6B6560; --fg-subtle: #A39F99;
  /* 强调 · 琥珀棕 */
  --accent: #5D3000; --accent-hover: #7A3F00; --accent-soft: #F5EDE3; --accent-border: #E8DCCA;
  /* 语义 */
  --success: #4C7A3F; --success-soft: #EBF3E5;
  --warning: #A66A00; --warning-soft: #F8ECD6;
  --error: #A23A2E; --error-soft: #F5E1DC;
  /* 边框 */
  --border-subtle: #EDE8DF; --border-default: #D6CEC0;
  /* 热度 */
  --heatmap-empty: #F0EBE3; --heatmap-low: #E6D9C3; --heatmap-mid: #C9A677; --heatmap-high: #5D3000;
  /* 阴影(加法:更细腻的层次) */
  --shadow-card: 0 1px 2px rgba(43,40,34,.04), 0 1px 3px rgba(43,40,34,.03);
  --shadow-hover: 0 4px 16px rgba(43,40,34,.08), 0 2px 6px rgba(43,40,34,.04);
  --shadow-pop: 0 12px 40px rgba(43,40,34,.14), 0 4px 12px rgba(43,40,34,.08);
  /* 字体 */
  --font-display: 'Space Grotesk', system-ui, -apple-system, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  /* 间距 / 圆角 */
  --space-card-inner: 20px; --space-card-gap: 16px; --space-section-gap: 24px;
  --radius-card: 14px; --radius-small: 9px; --radius-pill: 999px;
}

* { box-sizing:border-box; }
html,body { height:100%; }
body {
  margin:0; background:var(--bg-warm); color:var(--fg-primary);
  font-family:var(--font-body); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button { font-family:var(--font-body); }
.mono { font-family:var(--font-mono); font-size:12px; color:var(--fg-muted); }
.ds-label { font-family:var(--font-display); font-weight:700; font-size:11px; line-height:1.2; letter-spacing:1px; text-transform:uppercase; color:var(--fg-muted); }
.sec-label { color:var(--fg-primary); letter-spacing:1.2px; }
.ic { display:inline-flex; align-items:center; justify-content:center; flex:none; }
.ic svg { display:block; }

/* ============================================================
   应用壳:侧栏 + 主区
   ============================================================ */
.shell { display:flex; height:100vh; }

/* ───── 侧边导航 ───── */
.side { width:248px; flex:none; display:flex; flex-direction:column; border-right:1px solid var(--border-subtle); background:var(--bg-warm); padding:20px 12px 14px; }
.brand { display:flex; gap:11px; align-items:center; padding:0 8px 20px; }
.brand-mark { width:36px; height:36px; border-radius:var(--radius-small); background:linear-gradient(135deg,var(--accent),#7A3F00); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(93,48,0,.22); }
.brand-name { font-family:var(--font-display); font-weight:700; font-size:13px; letter-spacing:1px; color:var(--fg-primary); }
.brand-sub { font-size:10px; color:var(--fg-subtle); letter-spacing:.5px; text-transform:uppercase; margin-top:2px; font-family:var(--font-mono); }
.nav { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:18px; }
.nav::-webkit-scrollbar { width:0; }
.nav-group { display:flex; flex-direction:column; gap:2px; }
.nav-head { padding:0 10px 6px; color:var(--fg-subtle); }
.nav-item { display:flex; align-items:center; gap:10px; width:100%; position:relative; padding:8px 10px; border:none; appearance:none; -webkit-appearance:none; background:transparent; cursor:pointer; border-radius:var(--radius-small); color:var(--fg-muted); font-size:14px; transition:background-color .18s ease-out, color .18s ease-out; }
.nav-item:hover { background-color:var(--surface-sunken); color:var(--fg-primary); }
.nav-item:active { transform:scale(.99); }
.nav-item.on { background-color:var(--accent-soft); color:var(--accent); font-weight:600; }
.nav-item.on::before { content:""; position:absolute; left:-12px; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:var(--accent); }
.nav-label { flex:1; text-align:left; }
.nav-en { font-size:9px; letter-spacing:.6px; text-transform:uppercase; color:var(--fg-subtle); font-family:var(--font-mono); }
.nav-item.on .nav-en { color:var(--accent); opacity:.5; }
.nav-badge { background:var(--error); color:#fff; font-size:10.5px; font-weight:700; border-radius:var(--radius-pill); padding:1px 7px; font-family:var(--font-mono); min-width:20px; text-align:center; }
.nav-badge.look { background:var(--warning); }
.side-foot { border-top:1px solid var(--border-subtle); padding:12px 10px 0; display:flex; flex-direction:column; gap:8px; }
.side-status { font-size:12.5px; color:var(--fg-muted); display:flex; align-items:center; gap:7px; }
.side-reset { border:none; background:none; padding:0; text-align:left; cursor:pointer; font-size:11.5px; color:var(--fg-subtle); text-decoration:underline; text-underline-offset:2px; }
.side-reset:hover { color:var(--fg-muted); }
.dot { width:8px; height:8px; border-radius:50%; flex:none; }
.dot-pass { background:var(--success); box-shadow:0 0 0 3px var(--success-soft); }
.dot-wake { background:var(--error); } .dot-look { background:var(--warning); }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.45;} }
.dot-live { animation:pulse 2.4s ease-in-out infinite; }

/* ───── 顶栏 + 内容 ───── */
.main { flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar { position:sticky; top:0; z-index:5; flex:none; display:flex; align-items:center; justify-content:space-between; padding:16px 32px 14px; border-bottom:1px solid var(--border-subtle); background:rgba(250,248,246,.82); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); }
.top-title { font-family:var(--font-display); font-weight:700; font-size:21px; margin:0; color:var(--fg-primary); letter-spacing:-.2px; }
.top-sub { font-size:12.5px; color:var(--fg-muted); margin-top:3px; }
.top-right { display:flex; gap:8px; align-items:center; }
.chip { display:inline-flex; align-items:center; gap:5px; padding:4px 10px; background:var(--surface-sunken); border:1px solid var(--border-subtle); border-radius:var(--radius-small); font-family:var(--font-mono); font-size:11px; color:var(--fg-muted); }
.content { flex:1; overflow-y:auto; padding:26px 32px 56px; scroll-behavior:smooth; }
.page { max-width:1080px; margin:0 auto; display:flex; flex-direction:column; gap:var(--space-section-gap); }
@keyframes fadeUp { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
.page > * { animation:fadeUp .42s cubic-bezier(.2,.7,.3,1) both; }
.page > *:nth-child(2){ animation-delay:.04s; } .page > *:nth-child(3){ animation-delay:.08s; }
.page > *:nth-child(4){ animation-delay:.12s; } .page > *:nth-child(5){ animation-delay:.16s; }

/* ============================================================
   通用组件
   ============================================================ */
.card { background:var(--surface-white); border:1px solid var(--border-subtle); border-radius:var(--radius-card); box-shadow:var(--shadow-card); padding:var(--space-card-inner); }
.stat-row { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--space-card-gap); }
.stat-row-3 { grid-template-columns:repeat(3,1fr); }
.stat { transition:transform .16s ease-out, box-shadow .16s ease-out, border-color .16s ease-out; }
.stat:hover { transform:translateY(-2px); box-shadow:var(--shadow-hover); border-color:var(--border-default); }
.stat-n { font-family:var(--font-mono); font-weight:500; font-size:28px; color:var(--fg-primary); letter-spacing:-.5px; line-height:1.1; }
.stat-n.tone-error { color:var(--error); } .stat-n.tone-success { color:var(--success); } .stat-n.tone-warning { color:var(--warning); }
.stat-l { font-size:13px; color:var(--fg-muted); margin-top:5px; }
.stat-s { font-size:11.5px; color:var(--fg-subtle); margin-top:5px; }
.two-col { display:grid; grid-template-columns:1.4fr 1fr; gap:var(--space-card-gap); align-items:start; }
.sec-title { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; }
.sec-hint { font-size:12px; color:var(--fg-subtle); margin-left:10px; font-family:var(--font-body); font-weight:400; letter-spacing:0; text-transform:none; }
.sec-right { display:flex; gap:8px; align-items:center; }

.pill { display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:var(--radius-pill); font-family:var(--font-mono); font-size:10px; letter-spacing:.5px; text-transform:uppercase; font-weight:500; }
.pill-wake { background:var(--error-soft); color:var(--error); } .pill-look { background:var(--warning-soft); color:var(--warning); } .pill-pass { background:var(--success-soft); color:var(--success); }

.btn { display:inline-flex; align-items:center; gap:7px; border:none; cursor:pointer; border-radius:var(--radius-small); font-size:13.5px; font-weight:500; padding:9px 16px; transition:background .18s ease-out, transform .12s ease-out, box-shadow .18s ease-out; }
.btn:active { transform:scale(.97); } .btn:disabled { opacity:.5; cursor:default; }
.btn-primary { background:var(--accent); color:#fff; } .btn-primary:hover { background:var(--accent-hover); box-shadow:0 4px 12px rgba(93,48,0,.2); }
.btn-ghost { background:var(--surface-white); color:var(--accent); border:1px solid var(--accent-border); } .btn-ghost:hover { background:var(--accent-soft); }
.btn-quiet { background:none; color:var(--fg-muted); } .btn-quiet:hover { background:var(--surface-sunken); }
.btn-sm { padding:6px 11px; font-size:12.5px; }

.empty { display:flex; flex-direction:column; align-items:center; gap:10px; padding:40px 0; color:var(--fg-subtle); font-size:13.5px; text-align:center; }
.empty .ic { color:var(--fg-subtle); opacity:.7; }
.legend { font-size:11px; color:var(--fg-subtle); margin-top:8px; display:flex; align-items:center; gap:4px; }
.legend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin:0 4px 0 12px; } .legend i:first-child { margin-left:0; }
.foot-note { font-size:12px; color:var(--fg-subtle); margin:0; text-align:center; }

@keyframes shimmer { 0%{background-position:-400px 0;} 100%{background-position:400px 0;} }
.skel { background:linear-gradient(90deg,var(--surface-sunken) 25%,#EBE6DD 50%,var(--surface-sunken) 75%); background-size:800px 100%; animation:shimmer 1.3s linear infinite; border-radius:6px; }
.skel-line { height:13px; margin:9px 0; } .skel-stat { height:82px; border-radius:var(--radius-card); }

/* ───── 总览:态势裁决 ───── */
.verdict { display:flex; justify-content:space-between; gap:24px; padding:28px 30px; position:relative; overflow:hidden; }
.verdict-alert { background:var(--surface-white); border-color:var(--accent-border); }
.verdict-alert::after { content:""; position:absolute; inset:0 auto 0 0; width:4px; background:linear-gradient(var(--error),var(--warning)); }
.verdict-calm { background:linear-gradient(135deg,var(--success-soft),#F3F7EF); border-color:var(--border-subtle); }
.verdict-tag { color:var(--fg-subtle); }
.verdict-h { font-family:var(--font-display); font-weight:700; font-size:30px; margin:9px 0 7px; color:var(--fg-primary); letter-spacing:-.3px; }
.verdict-p { font-size:14.5px; color:var(--fg-muted); margin:0; max-width:560px; line-height:1.6; }
.verdict-actions { display:flex; gap:10px; margin-top:20px; }
.verdict-right { flex:none; text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:3px; justify-content:center; }
.verdict-big { font-family:var(--font-mono); font-size:58px; font-weight:500; color:var(--error); line-height:1; letter-spacing:-1px; }
.verdict-calm .verdict-big { color:var(--success); }
.verdict-sub { font-family:var(--font-mono); font-size:13px; color:var(--warning); }
.feed { display:flex; flex-direction:column; }
.feed-row { display:flex; gap:11px; padding:10px 0; border-bottom:1px solid var(--border-subtle); }
.feed-row:last-child { border-bottom:none; padding-bottom:0; } .feed-row:first-child { padding-top:0; }
.feed .dot { margin-top:6px; }
.feed-text { font-size:13.5px; color:var(--fg-primary); line-height:1.45; }
.feed-meta { display:flex; gap:10px; margin-top:3px; align-items:baseline; }
.feed-repo { font-size:11.5px; color:var(--fg-subtle); }

/* ───── 审查队列 ───── */
.queue-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.seg { display:inline-flex; background:var(--surface-sunken); border-radius:var(--radius-pill); padding:3px; gap:2px; }
.seg-btn { border:none; background:none; cursor:pointer; padding:6px 14px; border-radius:var(--radius-pill); font-size:12.5px; color:var(--fg-muted); font-family:var(--font-mono); transition:background .18s ease-out, color .18s ease-out; }
.seg-btn.on { background:var(--surface-white); color:var(--accent); font-weight:700; box-shadow:var(--shadow-card); }
.seg-mini .seg-btn { padding:3px 9px; font-size:10px; }
.kbd-hint { font-size:11.5px; color:var(--fg-subtle); display:flex; gap:6px; align-items:center; }
kbd { font-family:var(--font-mono); font-size:11px; background:var(--surface-sunken); border:1px solid var(--border-default); border-bottom-width:2px; border-radius:5px; padding:1px 6px; color:var(--fg-muted); }
.queue-grid { display:grid; grid-template-columns:336px 1fr; gap:var(--space-card-gap); align-items:start; }
.queue-list { display:flex; flex-direction:column; gap:10px; max-height:calc(100vh - 230px); overflow-y:auto; padding-right:4px; }
.q-item { padding:13px 15px; cursor:pointer; transition:border-color .18s ease-out, transform .12s ease-out, box-shadow .18s ease-out; }
.q-item:hover { border-color:var(--border-default); box-shadow:var(--shadow-hover); }
.q-item:active { transform:scale(.985); }
.q-item.q-on { border-color:var(--accent); box-shadow:0 0 0 1.5px var(--accent), var(--shadow-hover); }
.q-item-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.q-age { font-size:10.5px; }
.q-file { font-size:12.5px; color:var(--fg-primary); word-break:break-all; line-height:1.4; }
.q-meta { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
.q-repo { font-size:11px; color:var(--fg-subtle); }
.q-done { display:flex; gap:5px; align-items:center; margin-top:9px; font-size:11.5px; color:var(--fg-muted); border-top:1px dashed var(--border-subtle); padding-top:8px; }
.q-detail { padding:24px 26px; position:sticky; top:0; }
.qd-head { display:flex; justify-content:space-between; gap:16px; padding-bottom:16px; border-bottom:1px solid var(--border-subtle); }
.qd-file { font-size:15px; font-weight:500; color:var(--fg-primary); word-break:break-all; }
.qd-meta { display:flex; gap:8px; align-items:center; margin-top:9px; flex-wrap:wrap; }
.qd-agent { text-align:right; flex:none; font-size:13.5px; color:var(--fg-primary); }
.qd-agent .ds-label { display:block; margin-bottom:4px; }
.qd-block { padding:15px 0; border-bottom:1px solid var(--border-subtle); }
.qd-task { font-size:14.5px; color:var(--fg-primary); margin-top:7px; line-height:1.5; }
.qd-drift-row { display:flex; align-items:center; justify-content:space-between; gap:16px; }
.qd-reason { font-size:13.5px; color:var(--fg-muted); line-height:1.65; margin:7px 0 0; }
.qd-diff-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:9px; }
.t-add { color:var(--success); } .t-del { color:var(--error); }
.drift { display:flex; align-items:center; gap:10px; flex:1; max-width:300px; }
.drift-track { flex:1; height:7px; border-radius:var(--radius-pill); background:var(--surface-sunken); overflow:hidden; }
.drift-fill { height:100%; border-radius:var(--radius-pill); transition:width .5s cubic-bezier(.2,.7,.3,1); }
.drift-num { font-size:12px; font-weight:500; }
.diff { background:var(--surface-sunken); border:1px solid var(--border-subtle); border-radius:var(--radius-small); padding:10px 0; font-family:var(--font-mono); font-size:12px; line-height:1.7; overflow-x:auto; }
.diff-line { display:flex; padding:0 14px; white-space:pre; color:var(--fg-muted); }
.diff-sign { width:18px; flex:none; font-weight:700; }
.diff-add { background:var(--success-soft); color:var(--success); } .diff-del { background:var(--error-soft); color:var(--error); }
.qd-actions { display:flex; gap:10px; padding-top:18px; flex-wrap:wrap; }
.qd-approve { display:flex; gap:10px; padding-top:18px; align-items:center; }
.qd-decided { display:flex; gap:8px; align-items:center; padding-top:18px; font-size:13.5px; color:var(--success); font-weight:500; }
.qd-decided-inline { display:inline-flex; gap:6px; align-items:center; font-size:12.5px; color:var(--success); font-weight:500; }
.inp { flex:1; background:var(--surface-sunken); border:1px solid var(--border-subtle); border-radius:var(--radius-small); padding:9px 13px; font-size:13.5px; color:var(--fg-primary); font-family:var(--font-body); outline:none; transition:border-color .18s ease-out, background .18s ease-out, box-shadow .18s; }
.inp:focus { border-color:var(--accent); background:var(--surface-white); box-shadow:0 0 0 3px var(--accent-soft); }
.sel { flex:none; width:auto; cursor:pointer; }

/* ───── 表格 ───── */
.tbl { width:100%; border-collapse:collapse; }
.tbl th { text-align:left; font-family:var(--font-mono); font-size:10px; letter-spacing:.6px; text-transform:uppercase; color:var(--fg-subtle); font-weight:500; padding:0 10px 9px; border-bottom:1px solid var(--border-subtle); }
.tbl td { padding:11px 10px; border-bottom:1px solid var(--border-subtle); font-size:13px; color:var(--fg-primary); vertical-align:top; }
.tbl tr:last-child td { border-bottom:none; }
.tbl tbody tr { transition:background .14s ease-out; }
.tbl tbody tr:hover { background:var(--bg-warm); }
.tbl .num, .tbl th.num { text-align:right; font-variant-numeric:tabular-nums; }
.tbl-tight td { padding:7px 10px; }
.t-repo { color:var(--fg-primary); font-weight:500; }
.t-rules { display:flex; gap:5px; flex-wrap:wrap; }
.t-dim { color:var(--fg-subtle); font-size:12.5px; }
.t-by { font-size:11px; color:var(--fg-subtle); margin-top:3px; }
.bar { display:inline-block; height:8px; border-radius:var(--radius-pill); background:linear-gradient(90deg,var(--heatmap-mid),var(--accent)); vertical-align:middle; transition:width .5s ease-out; }
.chip-rule { display:inline-flex; align-items:center; gap:5px; padding:2px 8px; background:var(--surface-sunken); border:1px solid var(--border-subtle); border-radius:var(--radius-small); font-family:var(--font-mono); font-size:11px; color:var(--fg-muted); }

/* ───── 规则 ───── */
.r-name { font-size:13.5px; font-weight:600; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.r-desc { font-size:12px; color:var(--fg-subtle); margin-top:4px; }
.prec { display:flex; align-items:center; gap:8px; }
.prec-track { width:110px; height:6px; border-radius:var(--radius-pill); background:var(--error-soft); overflow:hidden; }
.prec-fill { height:100%; background:var(--success); border-radius:var(--radius-pill); transition:width .5s ease-out; }
.prec-num { font-size:11.5px; }
.evo-list { display:flex; flex-direction:column; gap:14px; }
.evo { border:1px solid var(--border-subtle); border-radius:var(--radius-small); padding:15px 17px; background:var(--bg-warm); transition:border-color .16s, box-shadow .16s; }
.evo:hover { border-color:var(--border-default); box-shadow:var(--shadow-card); }
.evo-head { display:flex; gap:8px; align-items:center; margin-bottom:9px; flex-wrap:wrap; }
.evo-repo { font-size:12px; color:var(--fg-subtle); }
.evo-why { font-size:13px; color:var(--fg-muted); line-height:1.65; margin:0 0 11px; }
.evo-cmd { background:var(--surface-sunken); border:1px solid var(--border-subtle); border-radius:var(--radius-small); padding:9px 12px; font-family:var(--font-mono); font-size:11.5px; color:var(--fg-primary); margin-bottom:11px; overflow-x:auto; white-space:nowrap; }

/* ───── 飞行记录 ───── */
.pol-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
.pol { border:1px solid var(--border-subtle); border-radius:var(--radius-small); padding:12px 14px; background:var(--bg-warm); }

/* ───── 危险地图 / 信箱 ───── */

/* ───── 下钻:可展开行 + 详情面板(守门记录/危险地图/越界共用) ───── */
.tbl tr.row-click { cursor:pointer; }

.origin-demo { background:var(--warning-soft); color:var(--warning); }
.q-no-diff { font-size:12px; color:var(--fg-subtle); background:var(--surface-sunken); border:1px dashed var(--border-default); border-radius:var(--radius-small); padding:12px 14px; line-height:1.6; }

/* ───── 热度图例 ───── */
.heat-legend { display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--fg-muted); margin-top:12px; padding-top:12px; border-top:1px dashed var(--border-subtle); }

/* ───── 规则页:级别 + 精度 ───── */
.lvl-tag { font-family:var(--font-mono); font-size:10px; padding:1px 7px; border-radius:var(--radius-pill); }
.lvl-wake { background:var(--error-soft); color:var(--error); } .lvl-look { background:var(--warning-soft); color:var(--warning); } .lvl-mixed { background:var(--surface-sunken); color:var(--fg-muted); }

/* ───── SVG 图表 tooltip(总览趋势 / 每日 token) ───── */
.chart-tip { position:fixed; z-index:60; pointer-events:none; background:var(--fg-primary); color:var(--bg-warm); font-family:var(--font-mono); font-size:11px; line-height:1.5; padding:7px 10px; border-radius:var(--radius-small); box-shadow:var(--shadow-pop); white-space:nowrap; opacity:0; transition:opacity .12s ease-out; }

.feed-row.feed-click:hover { background:var(--accent-soft); }

/* ════════ 问守门人 · ASK GUARD(从设计稿移植) ════════ */
.ask-backdrop { position:fixed; inset:0; z-index:40; background:rgba(45,30,10,.14); backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); animation:askFade 180ms ease-out; }
@keyframes askFade { from{opacity:0;} to{opacity:1;} }
.ask { position:fixed; right:24px; bottom:92px; z-index:41; width:408px; max-width:calc(100vw - 32px); height:600px; max-height:calc(100vh - 132px); background:var(--surface-white); border:1px solid var(--border-default); border-radius:16px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 18px 50px rgba(45,30,10,.18), 0 2px 8px rgba(45,30,10,.08); animation:askPop 200ms ease-out; transform-origin:bottom right; }

.ask-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 18px 14px; border-bottom:1px solid var(--border-subtle); }
.ask-head-l { display:flex; align-items:center; gap:11px; }
.ask-mark { width:32px; height:32px; flex:none; border-radius:var(--radius-small); background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; }
.ask-title { font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--fg-primary); letter-spacing:.2px; }
.ask-sub { font-size:10px; color:var(--fg-subtle); letter-spacing:.4px; margin-top:2px; }
.ask-x { border:none; background:none; cursor:pointer; color:var(--fg-subtle); padding:5px; border-radius:var(--radius-small); display:flex; transition:background 150ms ease-out, color 150ms ease-out; }
.ask-x:hover { background:var(--surface-sunken); color:var(--fg-primary); }

.ask-ctx-pill { display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:10.5px; color:var(--accent); letter-spacing:.3px; }
.ask-ctx-note { font-size:10.5px; color:var(--fg-subtle); }
.ask-body { flex:1; overflow-y:auto; padding:18px 18px 8px; display:flex; flex-direction:column; gap:16px; }
.ask-intro { padding:4px 2px 0; }
.ask-intro-p { font-size:13px; color:var(--fg-muted); line-height:1.62; margin:0; text-wrap:pretty; }
.ask-intro-p b { color:var(--fg-primary); font-weight:600; }
.ask-row { display:flex; }
.ask-row.user { justify-content:flex-end; }
.ask-row.ai { justify-content:flex-start; }
.ask-q { max-width:84%; background:var(--accent-soft); color:var(--fg-primary); border:1px solid var(--accent-border); padding:9px 13px; border-radius:13px 13px 4px 13px; font-size:13.5px; line-height:1.5; }
.ask-a { max-width:95%; display:flex; flex-direction:column; gap:9px; }
.ask-p { font-size:13.5px; color:var(--fg-primary); line-height:1.6; margin:0; text-wrap:pretty; }
.ask-stat { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.ask-stat-cell { background:var(--surface-sunken); border:1px solid var(--border-subtle); border-radius:var(--radius-small); padding:9px 10px; }
.ask-stat-n { font-family:var(--font-mono); font-size:19px; font-weight:500; color:var(--fg-primary); }
.ask-stat-l { font-size:10.5px; color:var(--fg-subtle); margin-top:2px; }
.ask-cluster { display:flex; flex-direction:column; gap:7px; }
.ask-cl-row { background:var(--surface-sunken); border:1px solid var(--border-subtle); border-left:2px solid var(--error); border-radius:var(--radius-small); padding:9px 11px; }
.ask-cl-top { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
.ask-cl-file { font-family:var(--font-mono); font-size:11px; color:var(--fg-muted); }
.ask-cl-why { font-size:12px; color:var(--fg-muted); line-height:1.5; }
/* 出处标签:把隐私分层画给用户看 */
.prov { display:inline-flex; align-items:center; gap:5px; align-self:flex-start; padding:3px 9px; border-radius:var(--radius-pill); font-size:10.5px; font-weight:500; letter-spacing:.2px; }
.prov-meta { background:var(--surface-sunken); color:var(--fg-muted); border:1px solid var(--border-subtle); }
.prov-local { background:var(--success-soft); color:var(--success); border:1px solid var(--success); }
.prov-cloud { background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-border); }
.prov-code { background:var(--error-soft); color:var(--error); border:1px solid var(--error); }
.prov-model { opacity:.7; font-family:var(--font-mono); font-size:9.5px; letter-spacing:0; }
.ask-prop { background:var(--accent-soft); border:1px solid var(--accent-border); border-radius:var(--radius-card); padding:12px 13px; margin-top:2px; }
.ask-prop-head { display:flex; align-items:center; gap:7px; color:var(--accent); margin-bottom:8px; }
.ask-prop-title { font-size:13px; font-weight:600; color:var(--fg-primary); }
.ask-prop-cmd { background:var(--surface-white); border:1px solid var(--border-subtle); border-radius:var(--radius-small); padding:7px 10px; font-family:var(--font-mono); font-size:11px; color:var(--fg-primary); line-height:1.5; overflow-x:auto; margin-bottom:9px; word-break:break-all; }
.ask-prop-foot { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.ask-prop-note { font-size:10.5px; color:var(--fg-subtle); line-height:1.4; flex:1; }

.ask-typing { display:inline-flex; align-items:center; gap:5px; padding:9px 13px; background:var(--surface-sunken); border-radius:13px 13px 13px 4px; }
.ask-typing span:not(.ask-typing-l) { width:6px; height:6px; border-radius:50%; background:var(--fg-subtle); animation:askDot 1s ease-in-out infinite; }
.ask-typing span:nth-child(2) { animation-delay:.16s; }
.ask-typing span:nth-child(3) { animation-delay:.32s; }
.ask-typing-l { font-size:11.5px; color:var(--fg-subtle); margin-left:4px; animation:none !important; }
@keyframes askDot { 0%,60%,100%{opacity:.3; transform:translateY(0);} 30%{opacity:1; transform:translateY(-3px);} }
.ask-foot { border-top:1px solid var(--border-subtle); padding:12px 16px 16px; background:var(--surface-white); }

.ask-chip { border:1px solid var(--border-default); background:var(--surface-white); cursor:pointer; padding:7px 12px; border-radius:var(--radius-pill); font-size:12px; color:var(--fg-muted); font-family:var(--font-body); transition:background 150ms ease-out, color 150ms ease-out, border-color 150ms ease-out; }
.ask-chip:hover { background:var(--accent-soft); color:var(--accent); border-color:var(--accent-border); }

.ask-inp-row { display:flex; align-items:center; gap:8px; }

.ask-send { flex:none; width:38px; height:38px; border-radius:50%; border:none; cursor:pointer; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; transition:background 160ms ease-out, transform 120ms ease-out; }
.ask-send:hover { background:var(--accent-hover); }
.ask-send:active { transform:scale(.94); }

/* ── 顶栏搜索框 ── */
.searchbox { display:flex; align-items:center; gap:9px; cursor:pointer; width:300px; max-width:38vw; padding:7px 9px 7px 13px; background:var(--surface-sunken); border:1px solid var(--border-default); border-radius:var(--radius-pill); color:var(--fg-subtle); font-family:var(--font-body); font-size:13px; transition:border-color 150ms ease-out, background 150ms ease-out, box-shadow 150ms ease-out; }
.searchbox:hover { border-color:var(--accent-border); background:var(--surface-white); box-shadow:var(--shadow-card); }
.searchbox-ph { flex:1; text-align:left; color:var(--fg-subtle); }
.searchbox-kbd { font-family:var(--font-mono); font-size:10.5px; color:var(--fg-muted); background:var(--surface-white); border:1px solid var(--border-subtle); border-radius:6px; padding:2px 6px; }

/* ── 命令面板 ── */
.pal-backdrop { position:fixed; inset:0; z-index:60; background:rgba(45,30,10,.18); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); display:flex; align-items:flex-start; justify-content:center; padding-top:12vh; animation:askFade 140ms ease-out; }
.pal { width:600px; max-width:92vw; background:var(--surface-white); border:1px solid var(--border-default); border-radius:14px; box-shadow:0 24px 60px rgba(45,30,10,.22); overflow:hidden; animation:askPop 160ms ease-out; transform-origin:top center; }
.pal-inp-row { display:flex; align-items:center; gap:11px; padding:14px 16px; border-bottom:1px solid var(--border-subtle); color:var(--fg-subtle); }
.pal-inp { flex:1; border:none; outline:none; background:none; font-family:var(--font-body); font-size:15px; color:var(--fg-primary); }
.pal-inp::placeholder { color:var(--fg-subtle); }
.pal-esc { font-family:var(--font-mono); font-size:10px; color:var(--fg-muted); border:1px solid var(--border-subtle); border-radius:6px; padding:2px 6px; letter-spacing:.4px; }
.pal-list { max-height:52vh; overflow-y:auto; padding:8px; }
.pal-group { font-family:var(--font-display); font-size:10px; font-weight:700; letter-spacing:.8px; color:var(--fg-subtle); text-transform:uppercase; padding:9px 10px 4px; }
.pal-item { display:flex; align-items:center; gap:11px; width:100%; text-align:left; border:none; background:none; cursor:pointer; padding:9px 10px; border-radius:var(--radius-small); color:var(--fg-primary); }
.pal-item.on { background:var(--accent-soft); }
.pal-item-ic { width:30px; height:30px; flex:none; border-radius:var(--radius-small); background:var(--surface-sunken); display:flex; align-items:center; justify-content:center; color:var(--fg-muted); }
.pal-item.on .pal-item-ic { background:var(--surface-white); color:var(--accent); }
.pal-item-main { flex:1; min-width:0; display:flex; flex-direction:column; }
.pal-item-label { font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pal-item-sub { font-size:11px; color:var(--fg-subtle); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pal-item-en { font-family:var(--font-mono); font-size:10px; color:var(--fg-subtle); letter-spacing:.4px; flex:none; }
.pal-item-tag { font-family:var(--font-mono); font-size:10px; color:var(--accent); flex:none; letter-spacing:.4px; }
.pal-foot { display:flex; align-items:center; gap:16px; padding:10px 16px; border-top:1px solid var(--border-subtle); background:var(--surface-sunken); }
.pal-foot-item { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--fg-muted); }
.pal-foot-k { font-family:var(--font-mono); font-size:10.5px; color:var(--fg-muted); background:var(--surface-white); border:1px solid var(--border-subtle); border-radius:5px; padding:1px 6px; }
.pal-empty { padding:30px 16px; text-align:center; color:var(--fg-subtle); font-size:13px; line-height:1.6; }

/* ── 右下角陪伴 orb ── */
.comp-orb { position:fixed; right:24px; bottom:24px; z-index:42; width:54px; height:54px; border-radius:50%; border:none; cursor:pointer; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(93,48,0,.32); transition:transform 160ms ease-out, background 160ms ease-out; }
.comp-orb:hover { transform:translateY(-2px); background:var(--accent-hover); }
.comp-orb:active { transform:scale(.94); }
.comp-orb.on { background:var(--fg-primary); box-shadow:0 8px 24px rgba(45,30,10,.3); }
.comp-orb-badge { position:absolute; top:-2px; right:-2px; min-width:20px; height:20px; padding:0 5px; border-radius:999px; background:var(--error); color:#fff; font-family:var(--font-mono); font-size:11px; display:flex; align-items:center; justify-content:center; border:2px solid var(--bg-warm); }
.comp-orb.pulsing::before { content:""; position:absolute; inset:-4px; border-radius:50%; border:2px solid var(--accent); opacity:.5; animation:orbPulse 1.8s ease-out infinite; }

/* ── 主动探头气泡 ── */
.comp-nudge { position:fixed; right:24px; bottom:90px; z-index:42; width:300px; max-width:calc(100vw - 32px); background:var(--surface-white); border:1px solid var(--accent-border); border-radius:14px; padding:14px 15px 13px; box-shadow:0 14px 36px rgba(45,30,10,.16); animation:nudgeIn 280ms cubic-bezier(.2,.8,.2,1); }
@keyframes nudgeIn { from{transform:translateY(8px) scale(.96); opacity:0;} to{transform:translateY(0) scale(1); opacity:1;} }
.comp-nudge::after { content:""; position:absolute; right:22px; bottom:-7px; width:14px; height:14px; background:var(--surface-white); border-right:1px solid var(--accent-border); border-bottom:1px solid var(--accent-border); transform:rotate(45deg); }
.comp-nudge-x { position:absolute; top:9px; right:9px; border:none; background:none; cursor:pointer; color:var(--fg-subtle); padding:3px; border-radius:6px; display:flex; transition:background 150ms ease-out, color 150ms ease-out; }
.comp-nudge-x:hover { background:var(--surface-sunken); color:var(--fg-primary); }
.comp-nudge-head { display:flex; align-items:center; gap:7px; font-family:var(--font-display); font-size:11px; font-weight:700; letter-spacing:.5px; color:var(--accent); text-transform:uppercase; margin-bottom:8px; }
.comp-nudge-dot { width:7px; height:7px; border-radius:50%; background:var(--error); box-shadow:0 0 0 3px var(--error-soft); }
.comp-nudge-p { font-size:13px; color:var(--fg-primary); line-height:1.55; margin:0 0 11px; text-wrap:pretty; padding-right:8px; }
.comp-nudge-p b { color:var(--accent); font-weight:600; }
.comp-nudge-cta { display:inline-flex; align-items:center; gap:6px; border:none; cursor:pointer; background:var(--accent); color:#fff; font-family:var(--font-body); font-size:12.5px; font-weight:500; padding:8px 13px; border-radius:var(--radius-pill); transition:background 150ms ease-out; }
.comp-nudge-cta:hover { background:var(--accent-hover); }

.err-bar { background:var(--error-soft); border:1px solid var(--error); border-radius:var(--radius-small); padding:11px 15px; font-size:13px; color:var(--error); display:flex; gap:9px; align-items:center; }
.toast-wrap { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:50; display:flex; flex-direction:column; gap:8px; align-items:center; }
.toast { background:var(--fg-primary); color:var(--bg-warm); padding:10px 18px; border-radius:var(--radius-pill); font-size:13px; box-shadow:var(--shadow-pop); display:flex; gap:8px; align-items:center; animation:fadeUp .3s ease-out; }

@media (max-width:980px) {
  .two-col, .queue-grid, .stat-row, .stat-row-3, .pol-row { grid-template-columns:1fr; }
  .side { width:208px; }
  .danger-intro { flex-direction:column; }
  .danger-mcp { border-left:none; padding-left:0; border-top:1px solid var(--border-subtle); padding-top:16px; }
}
</style>
