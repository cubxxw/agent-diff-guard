<!doctype html>
<!--
  agent-diff-guard 审计面板 — 单文件、零依赖。
  它服务的是"周期性审计":刷新页面 = 看一次过去的趋势,不主动推送、不实时刷。
  数据全部来自本机 ~/.agent-diff-guard/events.jsonl,不联网、不上传。
-->
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agent-diff-guard · 审计面板</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --fg: #e6edf3; --dim: #8b949e;
    --wake: #f85149; --look: #d29922; --pass: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: 32px 24px; max-width: 1000px; margin: 0 auto;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--dim); margin: 0 0 28px; font-size: 13px; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .card .n { font-size: 26px; font-weight: 600; }
  .card .l { color: var(--dim); font-size: 12px; margin-top: 2px; }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; margin-bottom: 20px; }
  section h2 { font-size: 14px; margin: 0 0 14px; font-weight: 600; }
  section .q { color: var(--dim); font-size: 12px; font-weight: 400; margin-left: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--dim); font-weight: 500; }
  .bar { height: 8px; border-radius: 4px; background: var(--wake); display: inline-block; vertical-align: middle; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; }
  .pill.blocked { background: rgba(248,81,73,.15); color: var(--wake); }
  .pill.human-approved { background: rgba(210,153,34,.15); color: var(--look); }
  .pill.auto-pass { background: rgba(63,185,80,.15); color: var(--pass); }
  .empty { color: var(--dim); padding: 24px 0; text-align: center; }
  code { color: var(--dim); font-size: 12px; }
  .legend { font-size: 11px; color: var(--dim); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 3px 0 10px; vertical-align: middle; }
</style>
</head>
<body>
  <h1>agent-diff-guard · 审计面板</h1>
  <p class="sub">本机只读 · 数据来自 ~/.agent-diff-guard/events.jsonl · 刷新页面看最新趋势</p>

  <div class="cards" id="cards"></div>

  <section>
    <h2>风险趋势<span class="q">— 水位在升还是降?哪天异常爆发?</span></h2>
    <div class="legend"><i style="background:var(--wake)"></i>wake-you-up<i style="background:var(--look)"></i>look-once<i style="background:var(--pass)"></i>放行</div>
    <div id="timeline"></div>
  </section>

  <section>
    <h2>高发规则排行<span class="q">— 我们的 agent 最常碰哪类危险区?</span></h2>
    <div id="rules"></div>
  </section>

  <section>
    <h2>放行审计流<span class="q">— 每条改动最终被拦了还是被放行了?</span></h2>
    <div id="dispositions"></div>
  </section>

<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));

async function get(path) {
  try { const r = await fetch(path); return await r.json(); }
  catch { return null; }
}

function renderCards(o) {
  if (!o) return;
  const pct = Math.round(o.passRate * 100);
  $("cards").innerHTML = [
    [o.totalScans, "总扫描次数"],
    [o.totalWake, "wake-you-up 命中"],
    [o.totalBlocked, "被刹住次数"],
    [pct + "%", "自动放行率"],
  ].map(([n, l]) => `<div class="card"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`).join("");
}

function renderRules(rows) {
  if (!rows || rows.length === 0) { $("rules").innerHTML = `<div class="empty">还没有数据 —— 跑几次 <code>agent-diff-guard check</code> 后回来看</div>`; return; }
  const max = Math.max(...rows.map(r => r.count));
  $("rules").innerHTML = `<table><thead><tr><th>规则</th><th>命中</th><th style="width:45%"></th></tr></thead><tbody>` +
    rows.map(r => {
      const w = Math.max(4, Math.round(r.count / max * 100));
      return `<tr><td><code>${esc(r.rule)}</code></td><td>${r.count}<span style="color:var(--dim)"> (${r.wakeCount} wake)</span></td>` +
             `<td><span class="bar" style="width:${w}%"></span></td></tr>`;
    }).join("") + `</tbody></table>`;
}

function renderTimeline(rows) {
  if (!rows || rows.length === 0) { $("timeline").innerHTML = `<div class="empty">还没有趋势数据</div>`; return; }
  const W = 920, H = 160, P = 28;
  const maxY = Math.max(1, ...rows.map(r => Math.max(r.wakeCount, r.lookCount, r.passCount)));
  const x = (i) => P + (rows.length === 1 ? (W - 2*P)/2 : i * (W - 2*P) / (rows.length - 1));
  const y = (v) => H - P - (v / maxY) * (H - 2*P);
  const line = (key, color) => {
    const pts = rows.map((r, i) => `${x(i).toFixed(1)},${y(r[key]).toFixed(1)}`).join(" ");
    return `<polyline fill="none" stroke="${color}" stroke-width="2" points="${pts}" />` +
           rows.map((r, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(r[key]).toFixed(1)}" r="2.5" fill="${color}" />`).join("");
  };
  const labels = rows.map((r, i) => i % Math.ceil(rows.length / 6 || 1) === 0
    ? `<text x="${x(i).toFixed(1)}" y="${H-8}" fill="var(--dim)" font-size="10" text-anchor="middle">${esc(r.date.slice(5))}</text>` : "").join("");
  $("timeline").innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:8px">` +
    `<line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="var(--border)" />` +
    line("passCount", "var(--pass)") + line("lookCount", "var(--look)") + line("wakeCount", "var(--wake)") +
    labels + `</svg>`;
}

function renderDispositions(rows) {
  if (!rows || rows.length === 0) { $("dispositions").innerHTML = `<div class="empty">还没有审计记录</div>`; return; }
  $("dispositions").innerHTML = `<table><thead><tr><th>时间</th><th>范围</th><th>wake</th><th>规则</th><th>处置</th></tr></thead><tbody>` +
    rows.slice(0, 50).map(r => {
      const t = r.timestamp.slice(0, 16).replace("T", " ");
      const rules = (r.rulesTriggered || []).join(", ") || "—";
      return `<tr><td><code>${esc(t)}</code></td><td><code>${esc(r.gitRange)}</code></td>` +
             `<td>${r.wakeCount}</td><td><code>${esc(rules)}</code></td>` +
             `<td><span class="pill ${esc(r.disposition)}">${esc(r.disposition)}</span></td></tr>`;
    }).join("") + `</tbody></table>`;
}

(async () => {
  const [o, rules, tl, disp] = await Promise.all([
    get("/api/stats/overview"), get("/api/stats/rules"),
    get("/api/stats/timeline"), get("/api/stats/dispositions"),
  ]);
  renderCards(o); renderTimeline(tl); renderRules(rules); renderDispositions(disp);
})();
</script>
</body>
</html>
